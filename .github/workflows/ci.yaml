name: Infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - run: python -m pip install -r scripts/requirements.txt
      - name: Python lint
        run: python -m ruff check scripts/
      - name: Python formatting
        run: python -m ruff format --check scripts/
      - name: Terraform checks, Python tests, and manifest analysis
        run: make check PYTHON=python
      - name: Coverage reports
        if: ${{ always() && hashFiles('.coverage') != '' }}
        run: |
          python -m coverage xml
          python -m coverage html
      - name: Upload coverage
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: error
  iac:
    name: Infrastructure security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - name: Install Trivy
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Terraform and Kubernetes misconfiguration scan
        run: |
          kubectl kustomize gitops/overlays/demo > "$RUNNER_TEMP/workloads.yaml"
          "$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 terraform/
          "$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 "$RUNNER_TEMP/workloads.yaml"
          "$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 gitops/argocd/
  secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete fetched history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .'
