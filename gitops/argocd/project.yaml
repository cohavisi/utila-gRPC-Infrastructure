apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: utila-grpc
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/cohavisi/utila-gRPC-Infrastructure.git
  destinations:
    - namespace: utila-grpc
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
