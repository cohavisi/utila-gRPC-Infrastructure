apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: utila-grpc
  namespace: argocd
spec:
  project: utila-grpc
  source:
    repoURL: https://github.com/cohavisi/utila-gRPC-Infrastructure.git
    targetRevision: main
    path: gitops/helm/greeter
    helm:
      releaseName: utila-grpc
      valueFiles:
        - ../demo-values.yaml
  destination:
    namespace: utila-grpc
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
