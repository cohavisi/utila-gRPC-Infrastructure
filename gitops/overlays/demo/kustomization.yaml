apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: utila-grpc
resources:
  - ../../base
configMapGenerator:
  - name: deployment-settings
    envs:
      - settings.env
images:
  - name: utila-grpc
    newName: us-central1-docker.pkg.dev/vast-maxim-388708/utila-grpc/greeter
    digest: sha256:0c0c3efd3609af7d3e58e6c8fb3c085bbec85f173cd2e027c63ba717b86bc862
patches:
  - path: bootstrap.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=utila-grpc
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=utila-grpc
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
  - target:
      kind: Deployment
      name: greeter-server
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/args/-
        value: --node-metadata=app=greeter
  - target:
      kind: Deployment
      name: greeter-client
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/args/-
        value: --node-metadata=app=greeter-client
replacements:
  - source:
      kind: ConfigMap
      name: deployment-settings
      fieldPath: data.SERVER_GSA
    targets:
      - select:
          kind: ServiceAccount
          name: greeter-server
        fieldPaths:
          - metadata.annotations.[iam.gke.io/gcp-service-account]
  - source:
      kind: ConfigMap
      name: deployment-settings
      fieldPath: data.CLIENT_GSA
    targets:
      - select:
          kind: ServiceAccount
          name: greeter-client
        fieldPaths:
          - metadata.annotations.[iam.gke.io/gcp-service-account]
