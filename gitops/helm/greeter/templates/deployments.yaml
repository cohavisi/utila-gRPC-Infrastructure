{{- range $role := list "server" "client" }}
{{- $server := eq $role "server" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-{{ $role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: utila-grpc
spec:
  replicas: {{ if $server }}{{ $.Values.server.replicas }}{{ else }}1{{ end }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: {{ if $server }}greeter{{ else }}greeter-client{{ end }}
  {{- if $server }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ if $server }}greeter{{ else }}greeter-client{{ end }}
      annotations:
        sidecar.istio.io/inject: "false"
        {{- if $server }}
        assignment.example.com/rollout: {{ $.Values.server.rolloutMarker | quote }}
        {{- end }}
        checksum/bootstrap-settings: {{ include "greeter.settings" $ | sha256sum | quote }}
    spec:
      serviceAccountName: greeter-{{ $role }}
      terminationGracePeriodSeconds: {{ if $server }}30{{ else }}15{{ end }}
      {{- if $server }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: greeter
      {{- end }}
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: bootstrap
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      initContainers:
        {{- include "greeter.bootstrap" (dict "root" $ "role" $role) | nindent 8 }}
      containers:
        - name: {{ $role }}
          image: {{ printf "%s@%s" $.Values.image.repository $.Values.image.digest | quote }}
          command: ["/{{ $role }}"]
          {{- if not $server }}
          args:
            - -target=xds:///greeter.utila.internal:50051
            - -count=0
            - {{ printf "-interval=%s" $.Values.client.interval | quote }}
            - {{ printf "-timeout=%s" $.Values.client.timeout | quote }}
          {{- end }}
          {{- if $server }}
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 50052
          {{- end }}
          env:
            - name: GRPC_XDS_BOOTSTRAP
              value: /bootstrap/bootstrap.json
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          {{- if $server }}
          startupProbe:
            grpc:
              port: 50052
              service: liveness
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            grpc:
              port: 50052
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            grpc:
              port: 50052
              service: liveness
            periodSeconds: 10
            timeoutSeconds: 2
          {{- end }}
          resources:
            {{- toYaml (index $.Values $role).resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
